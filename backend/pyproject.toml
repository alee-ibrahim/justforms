[project]
name = "justforms-backend"
version = "0.1.0"
description = "JustForms API: open-source forms builder backend"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.118",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.161.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joserfc>=1.7.7",
    "jsonpatch>=1.36",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyhanko>=0.38.0",
    "pypdfium2>=5.14.0",
    "redis>=5.3.1",
    "regex>=2026.9.29",
    "rfc8785>=0.1.4",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2",
    "uharfbuzz>=0.56.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Email templates: inline-styled HTML lines.
"app/notifications/emails.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["^alembic/"]
