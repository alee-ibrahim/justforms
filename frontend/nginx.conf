# Rendered by the nginx image's envsubst step (/etc/nginx/templates). ${...} values come from
# the environment; the CSP parts are built by docker-entrypoint.d/16-justforms-csp.envsh.

# Re-resolve the backend name while running, so recreating the backend container (new IP)
# doesn't leave nginx proxying to a stale address (502). NGINX_LOCAL_RESOLVERS is filled in
# from /etc/resolv.conf by the image's 15-local-resolvers.envsh.
resolver ${JUSTFORMS_NGINX_RESOLVER} valid=10s ipv6=off;
resolver_timeout 5s;

# Scheme the browser used: a TLS proxy in front (Cloudflare Tunnel, a load balancer) sends
# X-Forwarded-Proto; pass it on to the API instead of overwriting it with "http".
map $http_x_forwarded_proto $justforms_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Link-preview tags of a public form page (title, description, Open Graph, Twitter card), sent
# by the API with the frame-ancestors answer. They replace the page's placeholder title; without
# them (an older API, an error) the page keeps it.
map $justforms_head $justforms_head_html {
    ""      "<title>Form</title>";
    default $justforms_head;
}

# HSTS only when the request reached us over HTTPS (directly or via a TLS proxy).
map $http_x_forwarded_proto $justforms_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers: behind a TLS proxy nginx itself only sees http.
    absolute_redirect off;

    set $backend "${BACKEND_URL}";

    # API is proxied to the backend so the SPA and API share an origin. The API sets its own
    # security headers.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $justforms_forwarded_proto;
        client_max_body_size 50m;
    }

    # AI assistant requests stream Server-Sent Events for up to a couple of minutes: no
    # buffering, a long read timeout, and room for a 20 MB blank paper form.
    location ~ ^/api/v1/forms/[^/]+/ai/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $justforms_forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Asked by public form pages (/{slug}) for the form's frame-ancestors (its allowed websites)
    # and the page's link-preview tags (a header of up to ~10 KB: room for Thaana titles).
    location = /_justforms/frame-ancestors {
        internal;
        proxy_pass $backend/api/v1/public/frame-ancestors;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 32k;
    }

    # JustForms has no service worker. When it replaces another app on the same hostname, a
    # service worker that app registered can keep answering requests (e.g. redirect "/" to
    # another site). A plain 404 at the usual script paths makes the browser drop it at its
    # next update check. Never use these paths for JustForms files.
    location ~ ^/(sw|service-worker|serviceworker|firebase-messaging-sw|_nuxt/sw|OneSignalSDKWorker)\.js$ {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Site icon and manifests, linked by every page's HTML before any script runs: the default
    # organisation's branding icon and manifest, so a branded install shows its own icon from the
    # first byte. The API answers 404 when there is none (and may fail or rate-limit): JustForms'
    # own files from the image are served then.
    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|manifest\.webmanifest|form\.webmanifest)$ {
        proxy_pass $backend/api/v1/public/site/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $justforms_forwarded_proto;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_intercept_errors on;
        error_page 400 404 429 500 502 503 504 = @bundled_site_file;
    }

    location @bundled_site_file {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Crawler rules (public/robots.txt): link-preview bots may fetch everything; others only
    # public form pages and their preview images. Never a form slug ("robots" is reserved).
    location = /robots.txt {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=3600";
        default_type text/plain;
        charset utf-8;
        try_files /robots.txt =404;
    }

    # Never serve dotfiles (e.g. .gitignore in a mounted fonts directory).
    location ~ /\. {
        return 404;
    }

    # Operator-supplied fonts: files mounted at /srv/fonts win, otherwise the bundled
    # (empty) /fonts/fonts.css from the image is served.
    location /fonts/ {
        root /srv;
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri @bundled_fonts;
    }

    location @bundled_fonts {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Latin fonts a form theme can pick (built from OFL packages); only fetched when a form
    # uses one. File names carry a content hash, the stylesheets don't.
    location /theme-fonts/ {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Studio routes (client-side router).
    location = / {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_STUDIO}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    location ~ ^/(login|forms|settings)(/|$) {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_STUDIO}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # Old form links /f/{org}/{slug}: the form now lives at /{slug}.
    location ~ "^/f/[^/]+/([a-z0-9][a-z0-9-]{0,99})/?$" {
        return 301 /$1$is_args$args;
    }

    # Public form app (separate bundle): /{slug}, also embedded with ?embed=1. Slugs are unique
    # across the install and never one of the words above (backend app/services/slugs.py).
    # Which sites may frame it comes from the form's settings, via the API.
    # The page's <head> gets the form's link-preview tags (crawlers don't run scripts); when the
    # API can't answer, the plain page is served so the form app can show its own error.
    location ~ "^/[a-z0-9][a-z0-9-]{0,99}/?$" {
        auth_request /_justforms/frame-ancestors;
        auth_request_set $justforms_frame_ancestors $upstream_http_x_justforms_frame_ancestors;
        auth_request_set $justforms_head $upstream_http_x_justforms_head;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors $justforms_frame_ancestors" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $justforms_hsts always;
        add_header Cache-Control "no-cache";
        sub_filter "<title>Form</title>" $justforms_head_html;
        sub_filter_once on;
        try_files /form.html =404;
        error_page 500 502 503 504 = @public_form_plain;
    }

    location @public_form_plain {
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $justforms_hsts always;
        add_header Cache-Control "no-cache";
        try_files /form.html =404;
    }

    # Document pages (separate bundle): /v/{token} verify page (the QR code on signed PDFs) and
    # /a/{token} approver page. The token is in the path, so nothing may send it on as a
    # Referer, and no other site may frame them.
    location ~ ^/(v|a)/ {
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $justforms_hsts always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
        try_files /doc.html =404;
    }

    # Static files at the root (icons, manifests, the appearance script). Anything else is not a
    # page: the public form app shows its "couldn't find this form" screen, with a 404 status.
    location / {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
        error_page 404 /form.html;
    }
}
