# Rendered by the nginx image's envsubst step (/etc/nginx/templates). ${...} values come from
# the environment; the CSP parts are built by docker-entrypoint.d/16-justforms-csp.envsh.

# Re-resolve the backend name while running, so recreating the backend container (new IP)
# doesn't leave nginx proxying to a stale address (502). NGINX_LOCAL_RESOLVERS is filled in
# from /etc/resolv.conf by the image's 15-local-resolvers.envsh.
resolver ${JUSTFORMS_NGINX_RESOLVER} valid=10s ipv6=off;
resolver_timeout 5s;

# Scheme the browser used: a TLS proxy in front (Cloudflare Tunnel, a load balancer) sends
# X-Forwarded-Proto; pass it on to the API instead of overwriting it with "http".
map $http_x_forwarded_proto $justforms_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# HSTS only when the request reached us over HTTPS (directly or via a TLS proxy).
map $http_x_forwarded_proto $justforms_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers: behind a TLS proxy nginx itself only sees http.
    absolute_redirect off;

    set $backend "${BACKEND_URL}";

    # API is proxied to the backend so the SPA and API share an origin. The API sets its own
    # security headers.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $justforms_forwarded_proto;
        client_max_body_size 50m;
    }

    # AI assistant requests stream Server-Sent Events for up to a couple of minutes: no
    # buffering, a long read timeout, and room for a 20 MB blank paper form.
    location ~ ^/api/v1/forms/[^/]+/ai/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $justforms_forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Asked by public form pages (/{slug}) for the form's frame-ancestors (its allowed websites).
    location = /_justforms/frame-ancestors {
        internal;
        proxy_pass $backend/api/v1/public/frame-ancestors;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Never serve dotfiles (e.g. .gitignore in a mounted fonts directory).
    location ~ /\. {
        return 404;
    }

    # Operator-supplied fonts: files mounted at /srv/fonts win, otherwise the bundled
    # (empty) /fonts/fonts.css from the image is served.
    location /fonts/ {
        root /srv;
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri @bundled_fonts;
    }

    location @bundled_fonts {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Latin fonts a form theme can pick (built from OFL packages); only fetched when a form
    # uses one. File names carry a content hash, the stylesheets don't.
    location /theme-fonts/ {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Studio routes (client-side router).
    location = / {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_STUDIO}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    location ~ ^/(login|forms|settings)(/|$) {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_STUDIO}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # Old form links /f/{org}/{slug}: the form now lives at /{slug}.
    location ~ "^/f/[^/]+/([a-z0-9][a-z0-9-]{0,99})/?$" {
        return 301 /$1$is_args$args;
    }

    # Public form app (separate bundle): /{slug}, also embedded with ?embed=1. Slugs are unique
    # across the install and never one of the words above (backend app/services/slugs.py).
    # Which sites may frame it comes from the form's settings, via the API.
    location ~ "^/[a-z0-9][a-z0-9-]{0,99}/?$" {
        auth_request /_justforms/frame-ancestors;
        auth_request_set $justforms_frame_ancestors $upstream_http_x_justforms_frame_ancestors;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors $justforms_frame_ancestors" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $justforms_hsts always;
        add_header Cache-Control "no-cache";
        try_files /form.html =404;
    }

    # Document pages (separate bundle): /v/{token} verify page (the QR code on signed PDFs) and
    # /a/{token} approver page. The token is in the path, so nothing may send it on as a
    # Referer, and no other site may frame them.
    location ~ ^/(v|a)/ {
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $justforms_hsts always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
        try_files /doc.html =404;
    }

    # Static files at the root (icons, manifests, the appearance script). Anything else is not a
    # page: the public form app shows its "couldn't find this form" screen, with a 404 status.
    location / {
        include /etc/nginx/snippets/justforms-security-headers.inc;
        add_header Content-Security-Policy "${JUSTFORMS_CSP_PUBLIC}; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
        error_page 404 /form.html;
    }
}
